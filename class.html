<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hide Elements Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 40px;
    }

    .card {
      border: 1px solid #ccc;
      padding: 15px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .label {
      background-color: #fee;
      color: red;
      font-family: monospace;
      font-weight: bold;
      padding: 5px 10px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    .btn {
      background-color: #00b386;
      color: white;
      padding: 10px;
      width: 90%;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
    }

    .btn:hover {
      background-color: #009970;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- display:none example -->
    <div class="card" id="card1">
      <div class="label">display: none</div>
      <img id="img1" class="img" src="https://images.pexels.com/photos/159866/books-book-pages-read-literature-159866.jpeg?cs=srgb&dl=pexels-pixabay-159866.jpg&fm=jpg" alt="Sea View">
      <button class="btn" onclick="document.getElementById('card1').style.display='none'">Remove</button>
    </div>

    <!-- visibility:hidden example -->
    <div class="card">
      <div class="label">visibility: hidden</div>
      <img id="img2" class="img" src="https://images.pexels.com/photos/159866/books-book-pages-read-literature-159866.jpeg?cs=srgb&dl=pexels-pixabay-159866.jpg&fm=jpg" alt="Forest Path">
      <button class="btn" onclick="document.getElementById('img2').style.visibility='hidden'">Hide</button>
    </div>
  </div>

</body>
</html>
